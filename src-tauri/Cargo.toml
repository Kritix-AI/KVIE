[package]
name = "kritix"
version = "2.0.0"
description = "Kritix local-first voice AI desktop shell"
authors = ["Kritix"]
edition = "2021"

[lib]
name = "kritix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
arboard = "3"
enigo = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_JobObjects", "Win32_Security", "Win32_Foundation", "Win32_Graphics", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm"] }
windows = { version = "0.58", features = ["Win32_UI_Accessibility", "Win32_System_Com", "Win32_Foundation"] }
webview2-com = "0.38"
# webview2-com's generated interfaces are built on windows-core 0.61; rename so
# it can coexist with our windows 0.58 dependency.
windows-core61 = { package = "windows-core", version = "0.61" }

[features]
custom-protocol = ["tauri/custom-protocol"]
