name: Release KVIE (macOS & Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release Tag Name (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

jobs:
  build-and-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            bundle_args: '--bundles dmg,app'
          - platform: 'windows-latest'
            bundle_args: '--bundles nsis,msi'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: Build and Package with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.version_tag || github.ref_name }}
          releaseName: 'Kritix Voice Intelligence Engine ${{ github.event.inputs.version_tag || github.ref_name }}'
          releaseBody: |
            ## 🎙️ Kritix Voice Intelligence Engine (KVIE)
            
            ### 📦 Downloads & Installers:
            - **macOS**: Download the `.dmg` file for Apple Silicon & Intel Macs.
            - **Windows**: Download the `.exe` (NSIS setup) or `.msi` (WiX installer).
            
            ### ✨ Features Included:
            - 100% Wispr Flow parity with zero cloud lag & local-first privacy
            - System-wide global hotkey (`⌘ + ⌥ + R` on macOS / `Ctrl + Alt + R` on Windows)
            - Cross-application surrounding text context extraction & intelligent auto-editing
            - Voice Snippets, Voice Command mode, and Live Multilingual Translation
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.bundle_args }}
