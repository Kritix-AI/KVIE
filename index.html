<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <title>KVIE — Voice Intelligence Engine</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
        background: #0a0a1a;
        color: white;
        overflow: hidden;
      }
      html.floating-window-mode,
      body.floating-window-mode,
      body.floating-window-mode #root {
        background: transparent !important;
      }
      #root {
        width: 100%;
        height: 100vh;
      }
    </style>
    <script>
      if (window.location.search.includes('window=floating') || window.location.search.includes('window=ptt-indicator')) {
        document.documentElement.classList.add('floating-window-mode');
        document.documentElement.style.background = 'transparent';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
